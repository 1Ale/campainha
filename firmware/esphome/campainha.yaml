###############################################
# Campainha - Firmware preliminar (ESPHome)
# Baseado no esphome-intercom
###############################################

esphome:
  name: campainha
  friendly_name: Campainha Interfone

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# PSRAM é obrigatória para o stack de áudio full-duplex
psram:
  mode: octal

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Campainha Fallback"
    password: "campainha123"

captive_portal:

