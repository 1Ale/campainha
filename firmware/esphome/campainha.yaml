# ---------------------------------------------------------
# Hardware de linha (valores de GPIO são exemplos)
# ---------------------------------------------------------

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO4          # TODO: ajustar pino do opto de ring
      mode: INPUT_PULLUP
      inverted: true
    name: "Campainha Tocando"
    id: ring_detect
    device_class: occupancy
    filters:
      - delayed_on: 50ms
      - delayed_off: 300ms
    on_press:
      - logger.log: "Ring detectado"
      # TODO: acionar off-hook automaticamente ou via automação
      # TODO: iniciar chamada no stack de intercom

switch:
  - platform: gpio
    pin: GPIO5               # TODO: ajustar pino do SSR / MOSFET de off-hook
    name: "Off-hook"
    id: offhook
    restore_mode: ALWAYS_OFF
    # icon: mdi:phone-in-talk

# ---------------------------------------------------------
# Caller ID e abertura de porta (DTMF)
# ---------------------------------------------------------

text_sensor:
  - platform: template
    name: "Caller ID"
    id: caller_id
    # TODO: implementar decodificação DTMF real (software ou MT8870)

button:
  - platform: template
    name: "Abrir Porta"
    id: btn_abrir_porta
    on_press:
      - logger.log: "Comando de abertura de porta recebido"
      # TODO: gerar a sequência DTMF correta da central
      # Exemplo conceitual:
      # - lambda: id(dtmf).send("**");

