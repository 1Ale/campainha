#         - camera.interfone_atual          # câmera proxy
#         - button.abrir_porta
#     entity_config:
#       camera.interfone_atual:
#         name: "Interfone"
#         linked_doorbell_sensor: binary_sensor.campainha_tocando

# ---------------------------------------------------------
# Notas
# ---------------------------------------------------------
# - Crie uma câmera proxy (template, ffmpeg, go2rtc, etc.) que mude
#   a fonte de acordo com o valor de input_text.ultima_porta_chamada.
# - O linked_doorbell_sensor é o que faz o Apple Home tratar o conjunto
#   como uma campainha de vídeo única.
