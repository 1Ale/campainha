# Package de exemplo para Home Assistant
# Coloque este arquivo em config/packages/ (ou inclua via packages: no configuration.yaml)

# ---------------------------------------------------------
# Entidades auxiliares
# ---------------------------------------------------------

input_text:
  ultima_porta_chamada:
    name: "Última porta que chamou"
    max: 32
    initial: "desconhecida"

# ---------------------------------------------------------
# Automação de exemplo: atualiza a porta conforme Caller ID
# ---------------------------------------------------------

automation:
  - id: campainha_atualiza_caller_id
    alias: "Campainha - Atualiza porta pelo Caller ID"
    mode: single
    trigger:
      - platform: state
        entity_id: text_sensor.caller_id   # ajuste o entity_id real
    condition: []
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.ultima_porta_chamada
        data:
          value: "{{ trigger.to_state.state }}"
      # TODO: aqui você pode também selecionar a câmera correta
      # ou disparar notificação já com o feed adequado

# ---------------------------------------------------------
# HomeKit Bridge (exemplo)
# ---------------------------------------------------------
# Adicione no seu configuration.yaml ou em outro package:
#
# homekit:
#   - name: "Campainha Bridge"
